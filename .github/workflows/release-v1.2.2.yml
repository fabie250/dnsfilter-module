name: release-v1.2.2
on:
  push:
    paths:
      - '.release/v1.2.2-fix'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download module zip
        run: |
          curl -fL --retry 3 --retry-delay 5 -o dnsfilter-v1.2.2-arm64.zip "https://aka.doubaocdn.com/s/85FknVxbwW"
          ls -l dnsfilter-v1.2.2-arm64.zip
          unzip -p dnsfilter-v1.2.2-arm64.zip module.prop | head -6
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.2.2 dnsfilter-v1.2.2-arm64.zip --clobber
